<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Style Drop | Online Shop</title>
  <meta name="description" content="Shop curated Men & Women fashion, tech, and daily essentials on The Style Drop." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    /* EXACT SOFT BLUSH PINK THEME (MATCHES YOUR LOGO BACKGROUND SEAMLESSLY) */
    :root, [data-theme="light"] {
      --bg: #f6e3e4;
      --card-bg: #fdfaf6;
      --border: #ead2d4;
      --text: #18181b;
      --muted: #6b5e62;
      --pink: #f01267;
      --pill-bg: #f9f3eb;
      --badge-bg: #f6e3e4;
      --badge-text: #18181b;
      --social-bg: #7c686b;
      --shadow: 0 6px 18px rgba(124, 104, 107, 0.12);
      --sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    /* DARK MODE THEME */
    [data-theme="dark"] {
      --bg: #0f0c0e;
      --card-bg: #1a1518;
      --border: #33272c;
      --text: #f8fafc;
      --muted: #a39599;
      --pink: #f01267;
      --pill-bg: #241d21;
      --badge-bg: rgba(0, 0, 0, 0.8);
      --badge-text: #f7a246;
      --social-bg: #2d2428;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--sans); }
    html { scroll-behavior: smooth; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* TOP HEADER WITH SEAMLESS LOGO & DARK MODE BUTTON */
    header {
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 16px 18px;
      text-align: center;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: -10px;
      position: relative;
      z-index: 5;
    }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    .theme-toggle:hover { border-color: var(--pink); }

    /* SEAMLESS LOGO CONTAINER (NO BOX BORDER) */
    .logo-container {
      max-width: 230px;
      margin: 0 auto 10px;
    }
    .logo-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    /* SMART SEARCH BAR & CATEGORY FILTERS */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 620px;
      margin: 0 auto;
    }
    .search-wrap {
      position: relative;
      width: 100%;
    }
    .search-box {
      width: 100%;
      padding: 14px 22px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: #18181b;
      font-size: 0.92rem;
      outline: none;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    [data-theme="dark"] .search-box {
      background: var(--card-bg);
      color: var(--text);
    }
    .search-box:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(240, 18, 103, 0.2);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--pill-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--pink);
      color: #ffffff;
      border-color: var(--pink);
      font-weight: 700;
    }

    /* PRODUCT GRID (6 PRODUCTS PER PAGE) */
    main {
      max-width: 960px;
      width: 100%;
      margin: 14px auto 0;
      padding: 0 14px;
      flex-grow: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (min-width: 768px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.2s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--pink);
    }

    .badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 800;
      z-index: 2;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1.05;
      object-fit: cover;
      border-radius: 12px;
      background: #e5e7eb;
    }
    .card-body {
      padding: 10px 4px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-grow: 1;
    }
    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 4px;
      line-height: 1.3;
      color: var(--text);
    }
    .card-desc {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.4;
      margin-bottom: 10px;
      flex-grow: 1;
    }
    .cta-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--pink);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 9px;
      border-radius: 999px;
      box-shadow: 0 4px 10px rgba(240, 18, 103, 0.28);
      transition: transform 0.2s, opacity 0.2s;
    }
    .card:hover .cta-btn { opacity: 0.92; }

    .status {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 48px 16px;
      font-size: 0.92rem;
    }

    /* PAGINATION (< Prev 1 2 3 Next >) */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 26px auto 10px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--pill-bg);
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .page-btn.active {
      background: var(--pink);
      color: #ffffff;
      border-color: var(--pink);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* FOOTER: CIRCULAR SOCIAL ICONS & DISCLOSURE AT THE BOTTOM */
    footer {
      margin-top: 24px;
      padding: 20px 16px 32px;
      text-align: center;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .social-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--social-bg);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
      box-shadow: var(--shadow);
    }
    .social-btn:hover {
      transform: translateY(-2px);
      background: var(--pink);
    }
    .social-btn svg { width: 17px; height: 17px; fill: currentColor; }

    .disclosure {
      color: var(--muted);
      font-size: 0.74rem;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.5;
    }
  </style>
</head>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/" + "15xy8uLalVPQw07WEUPB3tO2oWqydjk7rKrvogjTSkx8" + "/export?format=csv";

    const ITEMS_PER_PAGE = 6;
    let products = [];
    let activeCategory = "all";
    let currentPage = 1;

    const grid = document.getElementById("productGrid");
    const paginationContainer = document.getElementById("paginationContainer");
    const searchInput = document.getElementById("searchInput");
    const filterBtns = document.querySelectorAll(".filter-btn");
    const themeToggle = document.getElementById("themeToggle");
    const htmlEl = document.documentElement;

    const savedTheme = localStorage.getItem("tsd_theme") || "light";
    setTheme(savedTheme);

    themeToggle.addEventListener("click", () => {
      const current = htmlEl.getAttribute("data-theme");
      setTheme(current === "light" ? "dark" : "light");
    });

    function setTheme(theme) {
      htmlEl.setAttribute("data-theme", theme);
      localStorage.setItem("tsd_theme", theme);
      themeToggle.innerHTML = theme === "light" ? "🌙 Dark Mode" : "☀️ Light Mode";
    }

    function normalizeText(str) {
      return (str || "").toLowerCase().replace(/[-\s]+/g, "");
    }

    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        products = results.data.reverse();
        renderProducts();
      },
      error: function() {
        grid.innerHTML = `<p class="status">Make sure your Google Sheet access is set to 'Anyone with the link'.</p>`;
      }
    });

    function getFilteredProducts() {
      const rawQuery = searchInput.value.toLowerCase().trim();
      const normQuery = normalizeText(rawQuery);

      return products.filter(p => {
        if (!p.title) return false;

        const cat = (p.category || "").toLowerCase().trim();
        const title = (p.title || "").toLowerCase();
        const desc = (p.desc || "").toLowerCase();
        const id = (p.id || "").toLowerCase();

        let matchesCat = false;
        if (activeCategory === "all") {
          matchesCat = true;
        } else if (activeCategory === "men") {
          matchesCat = cat === "men" || cat === "men fashion" || cat === "mens";
        } else if (activeCategory === "women") {
          matchesCat = cat === "women" || cat === "women fashion" || cat === "womens";
        } else {
          matchesCat = cat.includes(activeCategory);
        }

        if (!rawQuery) return matchesCat;

        const matchesRaw =
          title.includes(rawQuery) ||
          id.includes(rawQuery) ||
          desc.includes(rawQuery) ||
