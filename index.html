  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151c2c;
      --border: #263147;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
    .disclosure { background: #1e293b; color: var(--muted); font-size: 0.75rem; text-align: center; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    
    header { max-width: 1000px; margin: 0 auto; padding: 28px 16px 20px; text-align: center; }
    h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; text-transform: uppercase; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }

    /* Social Media Buttons */
    .social-links { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
    .social-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 7px 13px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; text-decoration: none; transition: 0.2s; }
    .social-btn:hover { transform: translateY(-2px); }
    .social-btn svg { width: 15px; height: 15px; fill: currentColor; }
    
    .insta:hover { color: #E1306C; border-color: #E1306C; }
    .x-tw:hover { color: #ffffff; border-color: #ffffff; background: #000000; }
    .yt:hover { color: #FF0000; border-color: #FF0000; }
    .fb:hover { color: #1877F2; border-color: #1877F2; }
    .pin:hover { color: #E60023; border-color: #E60023; }
    .reddit:hover { color: #FF4500; border-color: #FF4500; }
    .discord:hover { color: #5865F2; border-color: #5865F2; }

    .controls { display: flex; flex-direction: column; gap: 12px; max-width: 600px; margin: 0 auto; }
    .search-box { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.95rem; outline: none; }
    .search-box:focus { border-color: var(--accent); }
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; justify-content: center; flex-wrap: wrap; }
    .filter-btn { background: var(--card-bg); color: var(--muted); border: 1px solid var(--border); padding: 7px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    
    .grid { max-width: 1000px; margin: 20px auto 0; padding: 0 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); color: var(--accent); padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700; }
    .card-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #0f172a; }
    .card-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
    .card-desc { color: var(--muted); font-size: 0.8rem; line-height: 1.4; margin-bottom: 14px; flex-grow: 1; }
    .cta-btn { display: block; width: 100%; text-align: center; background: var(--accent); color: #000; font-weight: 700; font-size: 0.85rem; padding: 10px; border-radius: 8px; text-decoration: none; }
    .status { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }
  </style>
</head>

        <button class="filter-btn" data-category="fashion">Fashion</button>

  <main class="grid" id="productGrid">
    <p class="status">Loading products...</p>
  </main>

  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/" + "15xy8uLalVPQw07WEUPB3tO2oWqydjk7rKrvogjTSkx8" + "/export?format=csv";

    let products = [];
    let activeCategory = "all";
    const grid = document.getElementById("productGrid");
    const searchInput = document.getElementById("searchInput");
    const filterBtns = document.querySelectorAll(".filter-btn");

    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        products = results.data.reverse();
        renderProducts();
      },
      error: function() {
        grid.innerHTML = `<p class="status">Make sure your Google Sheet access is set to 'Anyone with the link'.</p>`;
      }
    });

    function renderProducts() {
      const query = searchInput.value.toLowerCase();
      grid.innerHTML = "";

      const filtered = products.filter(p => {
        if (!p.title) return false;
        const cat = (p.category || "").toLowerCase().trim();
        const matchesCat = activeCategory === "all" || cat === activeCategory;
        const matchesSearch =
          (p.title || "").toLowerCase().includes(query) ||
          (p.id || "").toLowerCase().includes(query) ||
          (p.desc || "").toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<p class="status">No matching products found.</p>`;
        return;
      }

      filtered.forEach(p => {
        grid.innerHTML += `
          <article class="card">
            <span class="badge">${p.id || ""}</span>
            <img src="${p.image || ""}" alt="${p.title}" class="card-img" loading="lazy" decoding="async" />
            <div class="card-body">
              <h2 class="card-title">${p.title}</h2>
              <p class="card-desc">${p.desc || ""}</p>
              <a href="${p.link || "#"}" target="_blank" rel="sponsored nofollow noopener" class="cta-btn">
                Check Price →
              </a>
            </div>
          </article>
        `;
      });
    }

    searchInput.addEventListener("input", renderProducts);
    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeCategory = btn.dataset.category;
        renderProducts();
      });
    });
  </script>
